name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and data-consistency tests (offline; use data/ and results_baseline/ from the repository)
        run: python -m pytest -q -rs tests
      - name: USGS-only pipeline smoke run (offline)
        run: python run_all.py --quick
